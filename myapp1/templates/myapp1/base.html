<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>{% block title %}My Site{% endblock %}</title>

    <style>
        /* Background image for the entire website */
        body {
            background-image: url("{% static 'images/background1.jpg' %}");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.8); /* Semi-transparent white */
            padding: 15px 20px;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .nav-menu li {
            position: relative;
        }

        .nav-menu li:not(:last-child)::after {
            content: "|";
            position: absolute;
            right: -12px;
            color: #999;
        }

        .nav-menu li a {
            color: #333;
            text-decoration: none;
            font-weight: bold;
            padding: 0 10px;
        }

        .nav-menu li a:hover {
            color: #FF0000;
        }

        .content {
            padding: 20px;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <ul class="nav-menu">
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'contact' %}">Contact</a></li>
            <li><a href="{% url 'about' %}">About</a></li>
            <li><a href="{% url 'resume' %}">Resume</a></li>
        </ul>
    </nav>

    <hr>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
